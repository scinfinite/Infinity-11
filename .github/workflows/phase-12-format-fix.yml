name: Phase 12 format fix

on:
  push:
    branches:
      - phase-12-full-stack-code-generation

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor == 'scinfinite' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/codegen/src/index.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/codegen/src/index.ts
          git commit -m "style(phase-12): format codegen source"
          git push
