name: Stage 6 temporary format helper

on:
  push:
    branches:
      - stage-6-agent-runtime-workforce

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'scinfinite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/agents/src/index.ts tests/integration/stage6.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add packages/agents/src/index.ts tests/integration/stage6.test.ts
          git commit -m "style(stage-6): format agent runtime files"
          git push
