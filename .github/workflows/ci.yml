name: CI

on:
  push:
    branches:
      - main
      - stage-1-engineering-foundation
      - stage-2-identity-persistence-events
      - stage-3-ai-gateway-providers-credentials
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Foundation verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - name: Enable pnpm
        run: corepack enable
      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: |
          if ! pnpm format:check; then
            pnpm format
            exit 1
          fi
      - name: Upload formatted workspace on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage4-prettier-output
          path: |
            packages/ai-gateway/src/routing.ts
            tests/integration/stage4.test.ts
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency security audit
        run: pnpm security

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
