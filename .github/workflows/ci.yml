name: CI

on:
  push:
    branches:
      - main
      - stage-1-engineering-foundation
      - stage-2-identity-persistence-events
      - stage-3-ai-gateway-providers-credentials
      - stage-4-model-registry-routing-failover
      - stage-5-execution-fabric-sandbox
      - stage-6-agent-runtime-workforce
      - stage-7-automation-fabric
      - stage-8-project-brain-context-knowledge
      - stage-9-verification-browser-visual-qa
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Foundation verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - name: Enable pnpm
        run: corepack enable
      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize Stage 9 formatting once
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec prettier --write packages/verification/src/index.ts tests/stage-9-verification.test.ts
          if git diff --quiet; then
            echo "Stage 9 formatting already clean"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/verification/src/index.ts tests/stage-9-verification.test.ts
            git commit -m "chore(stage-9): normalize verification formatting"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency security audit
        run: pnpm security

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
