name: CI

on:
  push:
    branches: [main, stage-1-engineering-foundation, stage-2-identity-persistence-events]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Foundation verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - name: Enable pnpm
        run: corepack enable
      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize latest Stage 2 files
        run: pnpm exec prettier --write packages/identity/src/index.ts packages/persistence/src/index.ts packages/events/src/index.ts packages/storage/src/index.ts tests/integration/stage2.test.ts tests/security/stage2.test.ts
      - name: Persist normalized Stage 2 files
        run: |
          if git diff --quiet -- packages/identity packages/persistence packages/events packages/storage tests/integration/stage2.test.ts tests/security/stage2.test.ts; then
            echo 'Stage 2 files already formatted.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add packages/identity packages/persistence packages/events packages/storage tests/integration/stage2.test.ts tests/security/stage2.test.ts
            git commit -m 'chore(stage-2): normalize implementation formatting [skip ci]'
            git push
          fi
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and contract tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency security audit
        run: pnpm security

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
