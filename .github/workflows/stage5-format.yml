name: Stage 5 formatter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/execution/package.json packages/execution/src/index.ts tests/integration/stage5.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/execution/package.json packages/execution/src/index.ts tests/integration/stage5.test.ts
          git diff --cached --quiet || git commit -m "style(stage-5): format execution fabric files"
          git push
