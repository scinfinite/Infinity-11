name: phase-13-format
on:
  push:
    branches: [phase-13-database-data-layer-builder]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/database/package.json packages/database/tsconfig.json packages/database/src/index.ts tests/phase-13-database.test.ts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add packages/database/package.json packages/database/tsconfig.json packages/database/src/index.ts tests/phase-13-database.test.ts
          git commit -m 'style(phase-13): format database builder'
          git push
