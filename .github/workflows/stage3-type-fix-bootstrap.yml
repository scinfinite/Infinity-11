name: Stage 3 typecheck fix bootstrap

on:
  push:
    branches: [stage-3-ai-gateway-providers-credentials]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          ai = Path('packages/ai-gateway/src/index.ts')
          s = ai.read_text()
          s = s.replace('usage?: AIUsage;', 'usage: AIUsage | undefined;')
          s = s.replace('finishReason?: string;', 'finishReason: string | undefined;')
          ai.write_text(s)
          db = Path('packages/persistence/src/index.ts')
          s = db.read_text()
          pattern = r'const next = \{\.\.\.current,\.\.\.patch,updatedAt: now\(\)\};'
          replacement = 'const next = { ...current, label: patch.label ?? current.label, ciphertext: patch.ciphertext ?? current.ciphertext, enabled: patch.enabled ?? current.enabled, updatedAt: now() };'
          if not re.search(pattern, s):
              raise SystemExit('expected credential update expression not found')
          db.write_text(re.sub(pattern, replacement, s))
          PY
      - run: pnpm exec prettier --write packages/ai-gateway/src/index.ts packages/persistence/src/index.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai-gateway/src/index.ts packages/persistence/src/index.ts
          git commit -m "fix(stage-3): normalize optional AI and credential fields"
          git push
