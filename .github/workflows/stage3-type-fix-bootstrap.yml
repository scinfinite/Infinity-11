name: Stage 3 typecheck fix bootstrap

on:
  push:
    branches: [stage-3-ai-gateway-providers-credentials]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          ai = Path('packages/ai-gateway/src/index.ts')
          s = ai.read_text()
          for name in ('inputTokens', 'outputTokens', 'totalTokens'):
              s = s.replace(f'{name}?: number;', f'{name}?: number | undefined;')
          s = s.replace('usage?: AIUsage;', 'usage?: AIUsage | undefined;')
          s = s.replace('finishReason?: string;', 'finishReason?: string | undefined;')
          ai.write_text(s)
          db = Path('packages/persistence/src/index.ts')
          s = db.read_text()
          s = s.replace('patch: { label?: string; ciphertext?: string; enabled?: boolean }', 'patch: { label?: string | undefined; ciphertext?: string | undefined; enabled?: boolean | undefined }')
          old = 'const next = { ...current, ...patch, updatedAt: now() };'
          new = 'const next = { ...current, label: patch.label ?? current.label, ciphertext: patch.ciphertext ?? current.ciphertext, enabled: patch.enabled ?? current.enabled, updatedAt: now() };'
          if old not in s:
              raise SystemExit('expected credential update expression not found')
          db.write_text(s.replace(old, new))
          PY
      - run: pnpm exec prettier --write packages/ai-gateway/src/index.ts packages/persistence/src/index.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai-gateway/src/index.ts packages/persistence/src/index.ts
          git commit -m "fix(stage-3): finalize optional AI and credential contracts"
          git push
