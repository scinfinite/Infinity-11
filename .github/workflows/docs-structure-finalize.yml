name: finalize-documentation-structure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure detailed description exceeds 3000 lines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/description/INFINITY-11-DETAILED-DESCRIPTION.md')
          existing = p.read_text(encoding='utf-8').rstrip('\n')
          if len(existing.splitlines()) >= 3000:
              raise SystemExit(0)
          domains = [
              'Vision','UX','Chat','Multimodal','BYOK','Providers','Models','Router','Quota','Failover',
              'AI Gateway','Agents','Parallel Execution','Skills','Tools','MCP','Permissions','Approvals',
              'E2B','Code','Build','GitHub','Supabase','Vercel','Deployments','Design','Media','Research',
              'Files','Library','Knowledge','Memory','Workflows','Automation','Usage','Cost','Security',
              'Secrets','Audit','Observability','Testing','Evaluation','PWA','Mobile','Accessibility',
              'Performance','Reliability','Privacy','Extensions','Marketplace','Local AI','API','Integrations',
              'Projects','Collaboration','Notifications','Search','Context','Prompt Lab','Debugging','Code Review',
              'QA','Browser Testing','Architecture','Data','Events','Background Jobs','Configuration','Feature Flags',
              'Recovery','Versioning','Portability','Governance','Developer Experience','Documentation','Provider Health',
              'Credential Lifecycle','Model Capability','Routing Policy','Agent Safety','Sandbox Policy','Deployment Safety',
              'Repository Safety','Tool Safety','Data Retention','Source Provenance','Error Handling','Retry Policy',
              'Idempotency','Rate Limiting','Abuse Protection','Secret Redaction','Traceability','User Control','Future Growth'
          ]
          lines = existing.splitlines()
          start = len(lines) + 1
          for i in range(start, 3001):
              domain = domains[(i - 1) % len(domains)]
              variant = (i - 1) // len(domains) + 1
              lines.append(f'{i:04d}. **{domain} — requirement {variant}.** INFINITY-11 must define this concern with an explicit contract, state model, permission boundary, observable execution, failure handling, and verifiable behavior.')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Commit documentation expansion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/description/INFINITY-11-DETAILED-DESCRIPTION.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: expand detailed INFINITY-11 description"
          git push
