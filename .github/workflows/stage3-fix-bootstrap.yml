name: Stage 3 lint fix bootstrap

on:
  push:
    branches: [stage-3-ai-gateway-providers-credentials]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/ai-gateway/src/index.ts')
          s = p.read_text()
          old = "    return this.db.listCredentials(workspaceId).map(({ ciphertext: _ciphertext, ...safe }) => safe);"
          new = "    return this.db.listCredentials(workspaceId).map((credential) => {\n      const { ciphertext, ...safe } = credential;\n      void ciphertext;\n      return safe;\n    });"
          if old not in s:
              raise SystemExit('expected lint target not found')
          p.write_text(s.replace(old, new))
          PY
      - run: pnpm exec prettier --write packages/ai-gateway/src/index.ts
      - run: pnpm lint
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai-gateway/src/index.ts
          git commit -m "fix(stage-3): avoid unused credential destructuring"
          git push
