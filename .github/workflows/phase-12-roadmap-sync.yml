name: Phase 12 roadmap sync

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor == 'scinfinite' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Synchronize authoritative roadmap status
        env:
          MERGE_SHA: 228798473d621ab07e8109c426f2aad436607959
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/architecture/INFINITY-11-V1-ROADMAP.md')
          text = path.read_text()
          text = text.replace(
              '> **Verified current main:** `c1a628ab60af2b987c9fedcba6eeedbcaae66448`.',
              '> **Verified current main:** `228798473d621ab07e8109c426f2aad436607959`.'
          )
          text = text.replace(
              '> **Current product position:** Phases 1–10 are recorded as completed; Phase 11 is the next planned implementation phase.',
              '> **Current product position:** Phases 1–12 are completed and verified; Phase 13 is the next planned implementation phase.'
          )
          text = text.replace(
              '| 11 | Advanced Application Builder Foundation | NOT COMPLETED | PENDING — phase not started |',
              '| 11 | Advanced Application Builder Foundation | COMPLETED | VERIFIED — merged main; green post-merge CI |'
          )
          text = text.replace(
              '| 12 | Full-Stack Code Generation | NOT COMPLETED | PENDING — phase not started |',
              '| 12 | Full-Stack Code Generation | COMPLETED | VERIFIED — merged main; green post-merge CI |'
          )
          for phase in (11, 12):
              pattern = rf'(# Phase {phase} — [^\\n]+\\n\\n)\\*\\*Status:\\*\\* NOT COMPLETED\\n\\*\\*CI verification:\\*\\* PENDING — phase not started'
              replacement = rf'\\1**Status:** COMPLETED\\n**CI verification:** VERIFIED — merged main; green post-merge CI'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update detailed Phase {phase} status')
          path.write_text(text)
          PY
      - name: Commit roadmap synchronization and remove temporary workflow
        run: |
          rm -f .github/workflows/phase-12-roadmap-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/INFINITY-11-V1-ROADMAP.md .github/workflows/phase-12-roadmap-sync.yml
          git commit -m "docs(phase-12): close authoritative roadmap status"
          git push
