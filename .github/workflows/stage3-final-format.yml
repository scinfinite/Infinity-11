name: Stage 3 final format bootstrap

on:
  push:
    branches: [stage-3-ai-gateway-providers-credentials]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write tests/integration/stage3.test.ts tests/integration/stage3-streaming.test.ts tests/security/stage3.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/stage3.test.ts tests/integration/stage3-streaming.test.ts tests/security/stage3.test.ts
          git commit -m "style(stage-3): format final tests"
          git push
