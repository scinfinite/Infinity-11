name: Stage 3 format bootstrap

on:
  push:
    branches: [stage-3-ai-gateway-providers-credentials]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/ai-gateway/package.json packages/ai-gateway/src/index.ts packages/persistence/src/index.ts tests/integration/stage3-streaming.test.ts tests/integration/stage3.test.ts tests/security/stage3.test.ts tests/regression/stage3.test.ts docs/phases/PHASE-3-AI-GATEWAY-PROVIDERS-CREDENTIALS.md .github/workflows/ci.yml
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ai-gateway/package.json packages/ai-gateway/src/index.ts packages/persistence/src/index.ts tests/integration/stage3-streaming.test.ts tests/integration/stage3.test.ts tests/security/stage3.test.ts tests/regression/stage3.test.ts docs/phases/PHASE-3-AI-GATEWAY-PROVIDERS-CREDENTIALS.md .github/workflows/ci.yml
          git commit -m "chore(stage-3): normalize formatting"
          git push
