<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">INFINITY-11</title>
  <desc id="desc">A luminous infinity symbol crossing a stylized double-one mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050711"/>
      <stop offset="1" stop-color="#0d1020"/>
    </linearGradient>
    <linearGradient id="infinity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16d9ff"/>
      <stop offset="0.42" stop-color="#1768ff"/>
      <stop offset="0.72" stop-color="#6d35ff"/>
      <stop offset="1" stop-color="#d15cff"/>
    </linearGradient>
    <linearGradient id="ones" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25dfff"/>
      <stop offset="0.55" stop-color="#316cff"/>
      <stop offset="1" stop-color="#7b4dff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

