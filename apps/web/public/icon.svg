<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">INFINITY-11 brand mark</title>
  <desc id="desc">A luminous infinity ribbon crossing a stylized double-one mark.</desc>
  <defs>
    <linearGradient id="infinity" x1="64" y1="150" x2="448" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18e1ff"/>
      <stop offset="0.34" stop-color="#1680ff"/>
      <stop offset="0.68" stop-color="#5b3dff"/>
      <stop offset="1" stop-color="#e052ff"/>
    </linearGradient>
    <linearGradient id="ones" x1="205" y1="88" x2="310" y2="275" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ce6ff"/>
      <stop offset="0.52" stop-color="#2d72ff"/>
      <stop offset="1" stop-color="#6d45ff"/>
    </linearGradient>
    <linearGradient id="highlight" x1="120" y1="176" x2="390" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6fbff" stop-opacity=".9"/>
      <stop offset="0.45" stop-color="#8bdcff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <path d="M190 126 222 104v105l-32 23zm88-22 34-23v132l-34 24z" fill="url(#ones)" opacity=".96" filter="url(#glow)"/>
  <path d="M190 126 222 104v105l-32 23zm88-22 34-23v132l-34 24z" fill="none" stroke="#9eeeff" stroke-width="2" opacity=".32"/>

  <path d="M91 191c44-56 102-56 147 0l18 23 18-23c45-56 103-56 147 0 38 47 38 94 0 141-44 56-102 56-147 0l-18-23-18 23c-45 56-103 56-147 0-38-47-38-94 0-141Zm30 24c-21 27-21 65 0 92 28 35 61 35 89 0l46-58-46-58c-28-35-61-35-89 0Zm181 34-46 58 46 58c28 35 61 35 89 0 21-27 21-65 0-92-28-35-61-35-89 0Z" fill="none" stroke="#613eff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity=".32" filter="url(#softGlow)"/>

  <path d="M91 191c44-56 102-56 147 0l18 23 18-23c45-56 103-56 147 0 38 47 38 94 0 141-44 56-102 56-147 0l-18-23-18 23c-45 56-103 56-147 0-38-47-38-94 0-141Z" fill="none" stroke="url(#infinity)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <path d="M96 188c42-49 96-48 137 3l23 29 23-29c41-51 95-52 137-3" fill="none" stroke="url(#highlight)" stroke-width="4" stroke-linecap="round" opacity=".72"/>
</svg>
