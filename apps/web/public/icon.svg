  <path d="M96 190c43-54 99-54 143 0l17 21 17-21c44-54 100-54 143 0 35 44 35 88 0 132-43 54-99 54-143 0l-17-21-17 21c-44 54-100 54-143 0-35-44-35-88 0-132Zm31 23c-20 25-20 61 0 86 27 34 58 34 85 0l44-54-44-54c-27-34-58-34-85 0Zm173 32-44 54 44 54c27 34 58 34 85 0 20-25 20-61 0-86-27-34-58-34-85 0Z" fill="none" stroke="#5d45ff" stroke-width="28" opacity=".42" filter="url(#softGlow)"/>

  <path d="M96 190c43-54 99-54 143 0l17 21 17-21c44-54 100-54 143 0 35 44 35 88 0 132-43 54-99 54-143 0l-17-21-17 21c-44 54-100 54-143 0-35-44-35-88 0-132Z" fill="none" stroke="url(#infinity)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <path d="M99 188c42-50 96-50 138 2l19 24 19-24c42-52 96-52 138-2" fill="none" stroke="#b8f7ff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
</svg>
